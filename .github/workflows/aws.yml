name: Verify and deploy Pokemon

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify site and AWS configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run aws:build:web
      - run: npm run aws:synth
      - name: Store the verified release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pokemon-release
          path: dist-aws/
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Publish pokemon.pir.kr
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://pokemon.pir.kr
    concurrency:
      group: pokemon-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Read the configured AWS target
        id: target
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          config = json.load(open('infra/config.json'))
          print('account=' + config['account'])
          print('region=' + config['region'])
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pokemon-release
          path: dist-aws/
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: pokemon-${{ github.run_id }}
          role-duration-seconds: 1800
          aws-region: ${{ steps.target.outputs.region }}
          allowed-account-ids: ${{ steps.target.outputs.account }}
      - name: Publish verified files and refresh CloudFront
        run: python3 scripts/deploy-aws.py
      - name: Verify the published site
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://pokemon.pir.kr/ -o /tmp/pokemon-index.html
          grep -q '포켓몬' /tmp/pokemon-index.html
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://pokemon.pir.kr/pokedex-manifest.json -o /tmp/pokemon-manifest.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/pokemon-manifest.json'))['speciesCount'] == 1025
          PY
          echo '### Published https://pokemon.pir.kr' >> "$GITHUB_STEP_SUMMARY"
